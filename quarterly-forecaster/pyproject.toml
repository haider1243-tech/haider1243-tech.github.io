[project]
name = "quarterly-forecaster"
version = "0.1.0"
description = "Probabilistic 4-quarter-ahead forecasts for major US indices and a custom watchlist."
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-q"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
filterwarnings = [
    # hmmlearn 0.3.3 sets ndarray.shape, deprecated in NumPy 2.5 (upstream issue)
    "ignore:Setting the shape on a NumPy array:DeprecationWarning:hmmlearn",
    # Starlette's TestClient now prefers a package named httpx2; the established
    # httpx still works. Not installing an unvetted package just to silence this.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
